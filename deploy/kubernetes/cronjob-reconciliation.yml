apiVersion: batch/v1
kind: CronJob
metadata:
  name: swiftdrop-outbox-reconciler
  namespace: swiftdrop
  labels:
    app.kubernetes.io/name: swiftdrop-outbox-reconciler
    app.kubernetes.io/part-of: swiftdrop
    app.kubernetes.io/component: background-worker
spec:
  # Run every 10 minutes (satisfies SRS §11.2 & §15.3 and Member 8/9 work division)
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: swiftdrop-outbox-reconciler
        spec:
          restartPolicy: OnFailure
          containers:
            - name: reconciler
              image: swiftdrop/core-api:latest
              imagePullPolicy: IfNotPresent
              command: ["/app/server", "reconcile", "--outbox-threshold=5m", "--delivery-timeout=24h"]
              envFrom:
                - configMapRef:
                    name: core-api-config
                - secretRef:
                    name: core-api-secrets
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "200m"
                  memory: "128Mi"
